# Backend on Render free, native Python with uv (ADR 0017). No Docker.
# Migrations and seed run in the build, once per deploy, not on every wake-up.
services:
  - type: web
    name: restaurant-agent-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: >-
      uv sync --locked --no-dev
      && uv run --no-sync alembic upgrade head
      && uv run --no-sync python -m scripts.seed_menu
      && uv run --no-sync python -m scripts.seed_demo_users
    startCommand: ./start.sh
    healthCheckPath: /api/health
    envVars:
      # Explicit, so uv uses this Python instead of downloading one outside the project.
      - key: PYTHON_VERSION
        value: "3.12"
      - key: APP_ENV
        value: production
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
