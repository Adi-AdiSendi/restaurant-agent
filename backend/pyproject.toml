[project]
name = "restaurant-agent"
version = "0.1.0"
description = "AI restaurant ordering assistant that remembers its users."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.143.3",
    "itsdangerous>=2.2.0",
    "openai>=3.33.0",
    "pydantic-settings>=2.16.0",
    "sqlalchemy[asyncio]>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "import-linter>=2.15",
    "pillow>=13.0.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# B008: FastAPI's Depends() in argument defaults is the intended pattern.
ignore = ["B008"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["app", "tests", "scripts", "migrations", "evals"]
exclude = ["migrations/versions"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --basetemp=.pytest-tmp"

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "One-way dependencies (ADR 0008)"
type = "layers"
layers = [
    "app.main",
    "app.api",
    "app.agent",
    "app.tools | app.memory | app.safety",
    "app.orders",
    "app.menu | app.users",
    "app.db",
    "app.config",
]
