# No false memories: only facts the user states about themselves are stored.
- id: extraction-friend-is-vegan
  category: extraction_precision
  description: A fact about someone else.
  users: [u]
  steps:
    - user: u
      say: My friend is vegan, what could she eat here?
  profiles:
    u:
      exact: true

- id: extraction-used-to-be-vegetarian
  category: extraction_precision
  description: A past fact, not a current one.
  users: [u]
  steps:
    - user: u
      say: I used to be vegetarian years ago. Anything good today?
  profiles:
    u:
      not_active: [[diet, vegetarian]]

- id: extraction-question-is-not-a-diet
  category: extraction_precision
  description: Asking about vegan dishes does not make the user vegan.
  users: [u]
  steps:
    - user: u
      say: What vegan options do you have?
  profiles:
    u:
      not_active: [[diet, vegan]]

- id: extraction-son-allergy
  category: extraction_precision
  description: The son's allergy, explicitly not the user's.
  users: [u]
  steps:
    - user: u
      say: My son has a peanut allergy but I don't. What's your spiciest dish?
  profiles:
    u:
      not_active: [[allergy, peanut]]

- id: extraction-own-allergy-only
  category: extraction_precision
  description: Positive control, exactly one fact.
  users: [u]
  steps:
    - user: u
      say: I'm allergic to shellfish. What starters do you have?
      expect:
        forbid_allergens: [shellfish]
  profiles:
    u:
      active: [[allergy, shellfish]]
      exact: true

- id: extraction-ordering-for-daughter
  category: extraction_precision
  added_after_baseline: true
  description: Ordering for someone else; none of her facts are the user's.
  users: [u]
  steps:
    - user: u
      say: I'm ordering for my daughter, she's vegan and allergic to sesame. What would she like?
  profiles:
    u:
      exact: true

- id: extraction-family-dinner
  category: extraction_precision
  added_after_baseline: true
  description: Mixed facts about the user and others in one message; only the user's is stored.
  users: [u]
  steps:
    - user: u
      say: Family dinner tonight. My husband is vegetarian, my son hates spicy food, and I'm allergic to sesame.
  profiles:
    u:
      active: [[allergy, sesame]]
      exact: true

# Day rules and a daily calorie goal, added 2026-10-18 before their first run.
- id: extract-day-rule
  category: extraction_precision
  description: A food avoided on one weekday is stored as a day rule, not a plain dislike.
  added_after_baseline: true
  users: [u]
  steps:
    - user: u
      say: I don't eat meat on Fridays.
  profiles:
    u:
      active: [[day_dislike, "friday: meat"]]
      exact: true

- id: extract-calorie-goal
  category: extraction_precision
  description: The guest's own daily calorie goal is stored as a number.
  added_after_baseline: true
  users: [u]
  steps:
    - user: u
      say: I'm trying to stay under 1800 calories a day.
  profiles:
    u:
      active: [[calories, "1800"]]
      exact: true

- id: extract-someone-elses-calories
  category: extraction_precision
  description: Another person's calorie count is not the guest's goal.
  added_after_baseline: true
  users: [u]
  steps:
    - user: u
      say: My sister is counting calories, she keeps it under 1500 a day.
  profiles:
    u:
      exact: true
