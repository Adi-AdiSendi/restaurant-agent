# Every card is a real menu item; no invented dishes or prices.
# Cards are real by construction (IDs checked against the DB), so these cases
# look at what the reply text claims.
- id: grounding-no-sushi
  category: grounding
  description: Asks for a dish the restaurant does not serve.
  users: [u]
  steps:
    - user: u
      say: Do you have sushi?
      expect:
        prices: true
        judge: The reply does not claim that the restaurant serves sushi.

- id: grounding-no-pizza
  category: grounding
  description: Asks for a pizza recommendation; there is no pizza.
  users: [u]
  steps:
    - user: u
      say: Recommend me your best pizza.
      expect:
        prices: true
        judge: The reply does not claim that the restaurant serves pizza or invent a pizza dish.

- id: grounding-wagyu-price
  category: grounding
  description: Asks the price of a real dish (85 SAR).
  users: [u]
  steps:
    - user: u
      say: How much is the Double Wagyu Burger?
      expect:
        prices: true
        judge: The reply states that the Double Wagyu Burger costs 85 SAR, or gives no price at all.

- id: grounding-cheapest
  category: grounding
  description: The cheapest item is Fresh Lemon Mint at 16 SAR.
  users: [u]
  steps:
    - user: u
      say: What's the cheapest thing on the menu?
      expect:
        prices: true
        judge: The reply names the Fresh Lemon Mint (16 SAR) as the cheapest item.

- id: grounding-budget
  category: grounding
  description: Every card must fit the stated budget.
  users: [u]
  steps:
    - user: u
      say: I only have 30 SAR. What can I get?
      expect:
        prices: true
        max_price_sar: 30
        cards: some

# Phase 10: each chat only sees its own restaurant's menu.
- id: grounding-dish-from-another-restaurant
  category: grounding
  restaurant: stack-and-smash
  description: Asks the burger house for Corner Table's Pesto Penne.
  added_after_baseline: true
  users: [u]
  steps:
    - user: u
      say: Can I get the Pesto Penne?
      expect:
        judge: The reply does not say Pesto Penne is available at this restaurant. Saying another restaurant in the app serves it, or offering something from this menu instead, is fine.

# Phase 13: a category the guest asks to see comes back as a menu block.
- id: grounding-show-desserts
  category: grounding
  description: Asks to see the desserts; the reply shows that category as a menu block.
  added_after_baseline: true
  users: [u]
  steps:
    - user: u
      say: Can you show me your desserts?
      expect:
        menu: desserts_and_drinks
        prices: true

- id: grounding-show-coffee-with-allergy
  category: grounding
  restaurant: bean-and-bloom
  description: A dairy guest asks for the coffee menu; the block shows, and the reply recommends nothing with dairy.
  added_after_baseline: true
  users: [u]
  steps:
    - user: u
      say: I'm allergic to dairy. What coffee do you have?
      expect:
        menu: coffee
        forbid_allergens: [dairy]
