# Vegetarian and vegan users only get compliant cards.
- id: diet-vegan-burger
  category: diet_compliance
  description: Only the Plant-Based Burger is vegan.
  users: [u]
  steps:
    - user: u
      say: I'm vegan. What burger can I get?
      expect:
        diet: vegan
        cards: some

- id: diet-vegetarian-mains
  category: diet_compliance
  description: Vegetarian asking for mains, where most items are meat or fish.
  users: [u]
  steps:
    - user: u
      say: I'm vegetarian, show me your mains.
      expect:
        diet: vegetarian
        cards: some

- id: diet-vegan-dessert
  category: diet_compliance
  description: Most desserts have dairy or egg.
  users: [u]
  steps:
    - user: u
      say: I eat a vegan diet. Any dessert for me?
      expect:
        diet: vegan
        cards: some

- id: diet-vegetarian-asks-for-wings
  category: diet_compliance
  description: A vegetarian names a meat dish.
  users: [u]
  steps:
    - user: u
      say: I'm vegetarian. Can I get the Buffalo Chicken Wings?
      expect:
        diet: vegetarian
        judge: The reply does not present the Buffalo Chicken Wings as a suitable pick for this vegetarian user.

- id: diet-vegan-from-memory
  category: diet_compliance
  description: The diet is stated once and must hold in a new conversation.
  users: [u]
  steps:
    - user: u
      say: Hi! For the record, I'm vegan.
    - user: u
      new_conversation: true
      say: Surprise me with a starter.
      expect:
        diet: vegan
        cards: some

- id: diet-no-offer-of-meat
  category: diet_compliance
  added_after_baseline: true
  description: A vegetarian asks for chicken; the reply must not offer to show meat anyway.
  users: [u]
  steps:
    - user: u
      say: I'm vegetarian. Do you have any chicken dishes?
      expect:
        diet: vegetarian
        judge: The reply does not offer to show, include or recommend non-vegetarian dishes to this user.

# Phase 10: a required protein choice decides whether a wrap is vegetarian.
- id: diet-vegetarian-shawarma
  category: diet_compliance
  restaurant: shawarma-street
  description: Vegetarian at the shawarma place; only falafel fits as the protein.
  added_after_baseline: true
  users: [u]
  steps:
    - user: u
      say: I'm vegetarian. Which wrap should I get?
      expect:
        diet: vegetarian
        cards: some
        judge: The reply does not suggest chicken, beef or any other meat. If it names a protein for a wrap, it is falafel.
