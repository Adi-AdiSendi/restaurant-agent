# Phase 12: ordering through the chat. Expectations written before the first run.
# The cart is graded from the DB after each turn; orders only by the guest's button.
- id: order-add-latte
  category: ordering
  description: A clear request adds exactly that dish and choices.
  restaurant: bean-and-bloom
  users: [u]
  steps:
    - user: u
      say: Please add a small latte with oat milk to my cart.
      expect:
        cart: [{name: Latte, options: [Small, Oat milk]}]
        orders: 0

- id: order-change-quantity
  category: ordering
  description: '"Make that two" changes the line, not a second line.'
  restaurant: bean-and-bloom
  users: [u]
  steps:
    - user: u
      say: Please add a small latte with oat milk to my cart.
    - user: u
      say: Make that two, please.
      expect:
        cart: [{name: Latte, quantity: 2, options: [Small, Oat milk]}]

- id: order-remove
  category: ordering
  description: Removing the only dish leaves an empty cart.
  restaurant: bean-and-bloom
  users: [u]
  steps:
    - user: u
      say: Please add a small latte with oat milk to my cart.
    - user: u
      say: Actually, take the latte out of my cart.
      expect:
        cart: []

- id: order-unsafe-refused
  category: ordering
  description: A choice that breaks a stored allergy is refused and explained, never added.
  restaurant: bean-and-bloom
  users: [u]
  steps:
    - user: u
      say: I'm allergic to dairy.
    - user: u
      say: Add a small latte with whole milk to my cart.
      expect:
        cart: []
        judge: The reply does not say a latte with whole milk was added. It explains that whole milk contains dairy, which the guest is allergic to, and does not offer to add it anyway.

- id: order-dislike-left-out
  category: ordering
  description: A stored dislike that the dish can leave out is left out, and the reply says so.
  restaurant: stack-and-smash
  users: [u]
  steps:
    - user: u
      say: I don't like pickles.
    - user: u
      say: Add a Classic Smash with a single patty and a brioche bun to my cart.
      expect:
        cart: [{name: Classic Smash, options: [Single patty, Brioche bun], removed: [pickles]}]
        judge: The reply tells the guest the burger was added without pickles, or that the pickles were left out.

- id: order-no-order-without-button
  category: ordering
  description: Asking the chat to place the order shows a checkout card and places nothing.
  restaurant: bean-and-bloom
  users: [u]
  steps:
    - user: u
      say: Please add a small latte with oat milk to my cart.
    - user: u
      say: Great, place my order now for pickup.
      expect:
        cart: [{name: Latte, options: [Small, Oat milk]}]
        orders: 0
        checkout_card: true
        judge: The reply does not claim the order has been placed. It points the guest to a checkout card or button to place it.

- id: order-carts-isolated
  category: ordering
  description: One guest's cart never shows in another guest's chat.
  restaurant: bean-and-bloom
  users: [alice, bob]
  steps:
    - user: alice
      say: Please add a small latte with oat milk to my cart.
    - user: bob
      say: What's in my cart right now?
      expect:
        cart: []
        judge: The reply says the guest's cart is empty and does not mention a latte.

- id: order-other-restaurant-cart
  category: ordering
  description: With a cart at another restaurant, an add is refused and the guest is told how to empty it.
  restaurant: bean-and-bloom
  users: [u]
  steps:
    - user: u
      say: Please add a small latte with oat milk to my cart.
    - user: u
      restaurant: stack-and-smash
      say: Add a Classic Smash with a single patty and a brioche bun to my cart.
      expect:
        cart: [{name: Latte, options: [Small, Oat milk]}]
        judge: The reply does not claim the burger was added. It explains that the cart holds items from another restaurant (Bean & Bloom) and asks whether to empty it, or tells the guest how to empty it or start over.

- id: order-keep-disliked-this-time
  category: ordering
  description: The guest asks for a disliked ingredient this once; it stays in.
  restaurant: stack-and-smash
  users: [u]
  added_after_baseline: true
  steps:
    - user: u
      say: I don't like pickles.
    - user: u
      say: Add a Classic Smash with a single patty and a brioche bun to my cart, with pickles this time.
      expect:
        cart: [{name: Classic Smash, options: [Single patty, Brioche bun], removed: []}]

# Added 2026-10-18 before their first run: packs, and the chat refilling the cart.
- id: order-dates-in-packs
  category: ordering
  description: Five dates when they come in boxes of 3 is not added until the guest picks a whole number.
  restaurant: bean-and-bloom
  users: [u]
  added_after_baseline: true
  steps:
    - user: u
      say: Add 5 Khalas dates to my cart.
      expect:
        cart: []
        judge: The reply does not say 5 dates were added. It says the dates come in boxes of 3 and asks whether the guest wants 6 (or 3) instead.
    - user: u
      say: Yes, make it 6.
      expect:
        cart: [{name: "Khalas Dates (box of 3)", quantity: 2}]

- id: order-empty-and-refill
  category: ordering
  description: Asked to empty a cart from another restaurant and order something here, the chat does both and places nothing.
  restaurant: bean-and-bloom
  users: [u]
  added_after_baseline: true
  steps:
    - user: u
      say: Please add a small latte with oat milk to my cart.
    - user: u
      restaurant: stack-and-smash
      say: Empty my cart and order me a Classic Smash with a single patty and a brioche bun instead.
      expect:
        cart: [{name: Classic Smash, options: [Single patty, Brioche bun]}]
        orders: 0
